# ============================================================================
# Starship 配置（WezTerm + Nushell）
# 基线：官方 tokyo-night 预设（starship preset tokyo-night）
# 增强参考：
#   * KnightChaser/starship-tokyonight-neo   同色系：python/c/cmd_duration/时间
#   * CoryCharlton/starship-configuration    结构组织、cmd_duration、git_status 细分
#   * ansidev/starship-primer                right_format 右对齐思路
#   * catppuccin/starship                    调色板/模块组织方式
#   * fang2hou/starship-gruvbox-rainbow      powerline 过渡技法
# 本机新增：python / java / docker_context / cmd_duration / jobs / c / cpp，
#           git_status 状态符号细化，时间移到 right_format 右对齐，character 统一配色。
# 备份：starship.toml.bak-20261025
# ============================================================================
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#a3aed2)\
$os\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$bun\
$rust\
$golang\
$c\
$cpp\
$php\
$python\
$java\
$docker_context\
[](fg:#212736 bg:#1d2230)\
$cmd_duration\
$jobs\
[ ](fg:#1d2230)\
\n$character"""

# 右侧提示符：时间右对齐（参考 ansidev/starship-primer 的 right_format 思路）
right_format = "$time"

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "≠"
deleted = "✘"
renamed = "»"
modified = "!"
untracked = "?"
stashed = "⚑"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[jj_bookmark]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ](fg:#769ff0 bg:#394260)]($style)'

[jj_status]
style = "bg:#394260"
format = '[[($all )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[bun]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

# c / cpp 模块来自 wezterm-kit 的 starship 方案（图标已用 ls-fonts 验证命中 CaskaydiaCove NF）
[c]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[cpp]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[python]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[java]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[docker_context]
symbol = ""
# 默认只在包含 Dockerfile/compose 的目录显示；这里改为只要 context 非默认就显示
only_with_files = false
style = "bg:#212736"
format = '[[ $symbol $context ](fg:#769ff0 bg:#212736)]($style)'

[cmd_duration]
min_time = 500
show_milliseconds = false
style = "bg:#1d2230"
format = '[[  $duration ](fg:#a0a9cb bg:#1d2230)]($style)'

[jobs]
symbol = ""
style = "bg:#1d2230"
format = '[[ $symbol($number) ](fg:#a0a9cb bg:#1d2230)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

[os]
style = "bg:#a3aed2 fg:#090c0c"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[character]
success_symbol = "[❯](bold #769ff0)"
error_symbol = "[❯](bold #ff757f)"
vimcmd_symbol = "[❮](bold #c099ff)"
